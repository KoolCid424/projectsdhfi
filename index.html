<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050709">
  <meta name="description" content="A collection of everything made by DHF Industries.">
  <title>DHF Projects</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html{min-height:100%;background:#050709}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 12% 88%,rgba(0,104,83,.13),transparent 38%),radial-gradient(ellipse at 88% 12%,rgba(0,83,145,.15),transparent 38%),#050709;color:#f4f7fa;font-family:Inter,Arial,sans-serif;display:flex;flex-direction:column}.top{position:absolute;top:34px;left:5.5vw;font-size:19px;font-weight:900;letter-spacing:-1.2px}.top span{color:#6cdbbd}.main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:110px 24px 80px}.content{max-width:900px}.eyebrow{font-size:10px;letter-spacing:5px;color:#7f929b;font-weight:600;margin-bottom:22px}.headline{font-size:clamp(64px,13vw,150px);line-height:.88;letter-spacing:-.095em;font-weight:900;margin:0 0 25px}.subtitle{font-size:clamp(13px,2vw,16px);letter-spacing:.035em;color:#a1adb5;margin:0 0 38px}.cta{display:inline-flex;align-items:center;gap:13px;padding:14px 20px;border:1px solid rgba(180,211,220,.2);border-radius:7px;color:#f5f8fa;text-decoration:none;font-size:11px;font-weight:700;letter-spacing:1.6px;transition:background .2s,border-color .2s,transform .2s}.cta:hover{background:rgba(255,255,255,.07);border-color:rgba(180,211,220,.48);transform:translateY(-2px)}.arrow{font-size:16px;color:#6cdbbd}footer{text-align:center;padding:0 20px 27px;color:#52616a;font-size:9px;letter-spacing:4px;font-weight:600}@media(max-width:520px){.top{top:25px;left:24px}.main{padding-top:100px}.headline{letter-spacing:-.085em}.subtitle{line-height:1.7}}
  </style>
</head>
<body>
  <div class="top">DHF<span>.</span></div>
  <main class="main">
    <section class="content">
      <div class="eyebrow">THE DHF INDUSTRIES COLLECTION</div>
      <h1 class="headline">PROJECTS.</h1>
      <p class="subtitle">A Collection Of Everything I Have Made</p>
      <a class="cta" href="/p">EXPLORE PROJECTS <span class="arrow">↗</span></a>
    </section>
  </main>
  <footer>DHF INDUSTRIES</footer>
</body>
</html>
