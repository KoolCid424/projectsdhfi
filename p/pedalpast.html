<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to PedalPast...</title>
  
  <!-- Fallback 1: Standard HTML Meta Refresh (works even if JavaScript is disabled) -->
  <meta http-equiv="refresh" content="3;url=https://pedalpast.co.uk">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(129, 140, 248, 0.2);
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    #countdown {
      color: #818cf8;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .btn {
      display: inline-block;
      background: #6366f1;
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      padding: 12px 24px;
      border-radius: 10px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #4f46e5;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .error-msg {
      display: none;
      margin-top: 20px;
      padding: 12px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      border-radius: 8px;
      color: #fca5a5;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h1 id="status-title">Taking you to AuraClicker</h1>
    <p id="status-desc">
      Redirecting to <strong>PedalPast.co.uk</strong> in <span id="countdown">3</span> seconds...
    </p>
    
    <!-- Fallback 2: Manual Click Button -->
    <a href="https://pedalpast.co.uk" class="btn" id="manual-link">Continue Now</a>

    <!-- Error Handling Display -->
    <div class="error-msg" id="error-box">
      Automatic redirect took longer than expected or was blocked by your browser. Please click the button above.
    </div>
  </div>

  <script>
    (function () {
      const targetUrl = "https://pedalpast.co.uk";
      let secondsLeft = 3;

      const countdownEl = document.getElementById("countdown");
      const titleEl = document.getElementById("status-title");
      const errorBox = document.getElementById("error-box");
      const spinner = document.getElementById("spinner");

      function performRedirect() {
        try {
          titleEl.textContent = "Redirecting now...";
          window.location.replace(targetUrl);
        } catch (err) {
          showError();
        }
      }

      function showError() {
        spinner.style.display = "none";
        titleEl.textContent = "Manual Action Required";
        errorBox.style.display = "block";
      }

      // Countdown interval
      const timer = setInterval(() => {
        secondsLeft -= 1;
        if (secondsLeft > 0) {
          countdownEl.textContent = secondsLeft;
        } else {
          countdownEl.textContent = "0";
          clearInterval(timer);
          performRedirect();
        }
      }, 1000);

      // Safety net: If the user is still on this page 2.5 seconds after redirect should have happened
      setTimeout(() => {
        showError();
      }, 5500);
    })();
  </script>

</body>
</html>
